<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦞 茜茜美股看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;padding:20px;max-width:1200px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.header h1{font-size:26px;font-weight:700;background:linear-gradient(135deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.meta{font-size:12px;color:#8b949e;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;background:#21262d;font-size:11px}
.mkt{padding:3px 8px;border-radius:10px;font-size:11px}
.mkt.open{color:#3fb950;background:#3fb95022}
.mkt.closed{color:#8b949e;background:#21262d}
.cd{color:#f0883e;font-size:11px}
.rbtn{padding:4px 12px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:12px;cursor:pointer}
.rbtn:hover{background:#30363d}
#status{color:#8b949e;font-size:12px;margin-bottom:14px}
.st{font-size:17px;font-weight:600;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
.card:hover{border-color:#58a6ff}
.card .sn{font-size:12px;color:#8b949e;margin-bottom:3px}
.card .price{font-size:20px;font-weight:700}
.card .chg{font-size:13px;font-weight:500}
.up{color:#3fb950}
.down{color:#f85149}
.card.idx{border-color:#58a6ff33}
.card.idx .price{font-size:24px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{display:inline-block;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid #30363d}
.tag.up{background:#3fb95022;border-color:#3fb95044;color:#7ee787}
.tag.down{background:#f8514922;border-color:#f8514944;color:#ffa198}
.tag.hot{background:#d2992222;border-color:#d2992244;color:#e3b341}
.footer{margin-top:30px;padding:14px;text-align:center;font-size:11px;color:#484f58;border-top:1px solid #21262d}
.loading{text-align:center;padding:40px;color:#8b949e}
.err{background:#3d1516;border:1px solid #f8514944;border-radius:8px;padding:20px;color:#ffa198;text-align:center}
@media(max-width:768px){.g3,.g4,.g7{grid-template-columns:repeat(2,1fr)}body{padding:12px}}
@media(max-width:480px){.g3,.g4,.g7{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <h1>🦞 茜茜美股看板</h1>
  <div class="meta">
    <span id="ut">--</span>
    <span class="badge" id="fb">自动</span>
    <span class="mkt closed" id="ms">--</span>
    <span class="cd" id="cd">⏱ --:--</span>
    <button class="rbtn" onclick="load()">⟳ 刷新</button>
  </div>
</div>
<div id="st"></div>
<div id="ct" class="loading">🦞 加载中…</div>
<div class="footer">🦞 茜茜美股看板 · 数据来源: 新浪财经</div>

<script>
const API = '/api/stocks';
const CFG = {
  idx:[{i:'inx',n:'标普500',e:'🏛️'},{i:'dji',n:'道琼斯',e:'🏛️'},{i:'ixic',n:'纳斯达克综合',e:'🚀'}],
  m7:[{i:'aapl',n:'苹果',e:'🍎'},{i:'msft',n:'微软',e:'💻'},{i:'googl',n:'谷歌',e:'🔍'},{i:'amzn',n:'亚马逊',e:'📦'},{i:'nvda',n:'英伟达',e:'🎮'},{i:'meta',n:'Meta',e:'📱'},{i:'tsla',n:'特斯拉',e:'🚗'}],
  sec:[{i:'smh',n:'SMH',e:'💎'},{i:'soxx',n:'SOXX',e:'💎'},{i:'arkk',n:'ARKK',e:'🚀'},{i:'gld',n:'GLD',e:'🥇'},{i:'xlk',n:'XLK',e:'💻'},{i:'xli',n:'XLI',e:'🏭'},{i:'qqq',n:'QQQ',e:'📈'},{i:'xlb',n:'XLB',e:'📦'},{i:'xly',n:'XLY',e:'🛍️'},{i:'xlre',n:'XLRE',e:'🏠'},{i:'tlt',n:'TLT',e:'💰'},{i:'slv',n:'SLV',e:'🥈'},{i:'xlf',n:'XLF',e:'🏦'},{i:'xlp',n:'XLP',e:'🛒'},{i:'xlv',n:'XLV',e:'🏥'},{i:'xlu',n:'XLU',e:'⚡'},{i:'xle',n:'XLE',e:'⛽'},{i:'ibit',n:'IBIT',e:'₿'}],
  semi:[{i:'arm',n:'Arm',e:'🦾'},{i:'nvda',n:'英伟达',e:'🎮'},{i:'intc',n:'英特尔',e:'💾'},{i:'mu',n:'美光',e:'💿'},{i:'asml',n:'阿斯麦',e:'🔬'},{i:'cohr',n:'Coherent',e:'📡'},{i:'lite',n:'Lumentum',e:'🔦'}],
  stor:[{i:'wdc',n:'西部数据',e:'🗄️'},{i:'stx',n:'希捷',e:'💾'},{i:'sndk',n:'SanDisk',e:'💿'}],
  ai:[{i:'nbis',n:'Nebius',e:'🌐'},{i:'crwv',n:'CoreWeave',e:'☁️'},{i:'eqix',n:'易昆尼克斯',e:'🏢'},{i:'be',n:'Bloom Energy',e:'⚡'}],
};
let rs=300, cs=300;

function fm(v){return v>=1000?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):v.toFixed(2)}

function cd(it,d,ex){
  if(!d) return '<div class="card"><div class="sn">'+it.e+' '+it.n+'</div><div class="price">--</div></div>';
  const p=+d.pct,c=p>0?'up':p<0?'down':'',a=p>0?'▲':p<0?'▾':'—',s=p>0?'+':'';
  const ch=d.change&&!isNaN(+d.change)?(+d.change>0?'+':'')+ (+d.change).toFixed(2):'';
  return '<div class="card"><div class="sn">'+it.e+' '+it.n+'</div><div class="price">$'+fm(d.price)+'</div><div class="chg '+c+'">'+a+' '+s+(+d.pct).toFixed(2)+'%'+(ch?' ($'+ch+')':'')+'</div>'+(ex||'')+'</div>'
}

function ic(it,d){
  if(!d) return '<div class="card idx"><div class="sn">'+it.e+' '+it.n+'</div><div class="price">--</div></div>';
  const p=+d.pct,c=p>0?'up':p<0?'down':'',a=p>0?'▲':p<0?'▾':'—',s=p>0?'+':'';
  return '<div class="card idx"><div class="sn">'+it.e+' '+it.n+'</div><div class="price '+c+'">$'+fm(d.price)+'</div><div class="chg '+c+'">'+a+' '+s+(+d.pct).toFixed(2)+'%</div></div>'
}

function rn(d){
  const n=new Date();
  document.getElementById('ut').textContent='🕐 '+n.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
  const ny=new Date(n.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const h=ny.getHours(),m=ny.getMinutes(),wd=ny.getDay(),tm=h*60+m,tr=wd>=1&&wd<=5&&tm>=570&&tm<=960;
  document.getElementById('ms').textContent=tr?'交易中':(wd>=6?'周末休市':(tm<570?'盘前':'已收盘'));
  document.getElementById('ms').className='mkt '+(tr?'open':'closed');
  rs=tr?60:300;cs=Math.min(cs,rs);
  document.getElementById('fb').textContent=rs<=60?'交易中 每分钟':'非交易 每5分钟';
  document.getElementById('st').textContent='纽约: '+n.toLocaleString('zh-CN',{timeZone:'America/New_York',hour12:false})+' | '+Object.keys(d).length+'只股票';
  let h='<div class="st">📈 市场指数</div><div class="g3">'+CFG.idx.map(x=>ic(x,d[x.i])).join('')+'</div>';
  h+='<div class="st">📊 七巨头</div><div class="g7">'+CFG.m7.map(x=>cd(x,d[x.i])).join('')+'</div>';
  const sr=CFG.sec.map(x=>({x,y:d[x.i]})).sort((a,b)=>{const pa=a.y?+a.y.pct:-999,pb=b.y?+b.y.pct:-999;return pb-pa});
  h+='<div class="st">🔥 板块/ETF</div><div class="tags">';
  sr.forEach(s=>{if(!s.y)return;const p=+s.y.pct;h+='<span class="tag '+(p>3?'hot up':p>0?'up':p<0?'down':'')+'">'+s.x.e+' '+s.x.n+' '+(p>0?'+':'')+p.toFixed(2)+'%</span>'});
  h+='</div>';
  h+='<div class="st">💎 半导体</div><div class="g4">'+CFG.semi.map(x=>cd(x,d[x.i],d[x.i]?'<div class="sn">昨收 $'+fm(d[x.i].prevClose)+'</div>':'')).join('')+'</div>';
  h+='<div class="st">🖥️ 存储/数据中心</div><div class="g3">'+CFG.stor.map(x=>cd(x,d[x.i],d[x.i]?'<div class="sn">昨收 $'+fm(d[x.i].prevClose)+'</div>':'')).join('')+'</div>';
  h+='<div class="st">☁️ AI算力</div><div class="g4">'+CFG.ai.map(x=>cd(x,d[x.i],d[x.i]?'<div class="sn">昨收 $'+fm(d[x.i].prevClose)+'</div>':'')).join('')+'</div>';
  document.getElementById('ct').innerHTML=h;
}

function load(){
  document.getElementById('ct').innerHTML='<div class="loading">🦞 加载中…</div>';
  fetch(API).then(r=>r.json()).then(d=>{
    if(d.status==='ok'&&d.data){
      if(Object.keys(d.data).length===0){throw new Error('无数据')}
      rn(d.data);
      if(d.refresh_seconds){rs=d.refresh_seconds;cs=rs}
      if(d.market_status){
        const e=document.getElementById('ms');
        e.textContent=d.market_status;e.className='mkt '+(d.market_status.includes('交易')?'open':'closed');
      }
    }else throw new Error(d.msg||'API错误')
  }).catch(e=>{
    document.getElementById('ct').innerHTML='<div class="err">⚠️ 数据获取失败<br><span style="font-size:12px;color:#8b949e;">'+e.message+'</span></div>'
  })
}

setInterval(()=>{cs--;if(cs<=0){cs=rs;load()}document.getElementById('cd').textContent='⏱ '+Math.floor(cs/60)+':'+(cs%60).toString().padStart(2,'0')},1000);
load();
</script>
</body>
</html>
